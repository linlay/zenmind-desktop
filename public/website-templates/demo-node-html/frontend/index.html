<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenMind Demo App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="status-panel">
        <p class="eyebrow">Local Website App</p>
        <h1>ZenMind Demo App</h1>
        <p class="summary">前端由 Desktop 托管，后端由本地 Node.js 进程提供 API。</p>
        <div class="status-grid">
          <article>
            <span>Backend</span>
            <strong id="health">checking...</strong>
          </article>
          <article>
            <span>Server Time</span>
            <strong id="server-time">--</strong>
          </article>
          <article>
            <span>Visits</span>
            <strong id="visits">--</strong>
          </article>
        </div>
        <button id="refresh" type="button">刷新后端数据</button>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
